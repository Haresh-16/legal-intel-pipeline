name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Worker unit/integration tests mock Sheets, The News API, and Groq —
      # no live network calls or secrets are needed to run the suite.
      - run: npm run test:worker
      - run: npm run build:frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Frontend must be built before wrangler deploy — the Worker bundles
      # frontend/dist as static assets via [assets] in wrangler.toml.
      - name: Build frontend
        run: npm run build:frontend

      - name: Apply D1 migrations (remote)
        working-directory: worker
        run: npx wrangler d1 migrations apply legal-intel-db --remote

      # wrangler secret put is idempotent — safe to re-run on every deploy.
      - name: Sync worker secrets
        working-directory: worker
        run: |
          echo "${{ secrets.GROQ_API_KEY }}" | npx wrangler secret put GROQ_API_KEY
          echo "${{ secrets.THE_NEWS_API_TOKEN }}" | npx wrangler secret put THE_NEWS_API_TOKEN
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}" | npx wrangler secret put GOOGLE_SERVICE_ACCOUNT_EMAIL
          echo "${{ secrets.GOOGLE_PRIVATE_KEY }}" | npx wrangler secret put GOOGLE_PRIVATE_KEY
          echo "${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}" | npx wrangler secret put GOOGLE_SHEETS_SPREADSHEET_ID

      - name: Deploy worker (includes bundled frontend assets)
        working-directory: worker
        run: npx wrangler deploy
